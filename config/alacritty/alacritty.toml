# Import additional configuration files
# import[,]
# Imports are loaded in order, skipping all missing files, with the importing
# file being loaded last. If a field is already present in a previous import,
# it will be replaced.

# All imports must either be absolute paths starting with _/_, or paths
# relative to the user's home directory starting with _~/_.

# Directory the shell is started in. When this is unset, or _None_, the
# working directory of the parent process will be used.

working_directory = "None"
live_config_reload = true

 

# All key-value pairs in the env section will be added as environment variables for any process spawned by Alacritty, including its shell. 
# Some entries may override variables set by alacritty itself.
[env]
TERM = "alacritty"

#[window]

[scrolling]
history = 100000

#[font]

[selection]
save_to_clipboard = true


# tmux jumps to pane 1-3 on Ctrl+1..Ctrl+3 (see config/tmux/.tmux.conf), but a
# terminal has no native encoding for Ctrl+digit: Ctrl+1 sends a bare digit and
# Ctrl+3 collides with Escape. Send the CSI-u form instead, which tmux parses
# back into C-1 .. C-3.
[[keyboard.bindings]]
key = "1"
mods = "Control"
chars = "\u001B[49;5u"
[[keyboard.bindings]]
key = "2"
mods = "Control"
chars = "\u001B[50;5u"
[[keyboard.bindings]]
key = "3"
mods = "Control"
chars = "\u001B[51;5u"
