# set zsh as default shell
set-option -g default-shell /bin/zsh

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux continuum
# to auto restore tmux sessions
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-processes 'false'
set -g @resurrect-default-processes 'false'

# Move around panes with hjkl, as one would in vim after pressing ctrl + w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-tmux-navigator: Ctrl+hjkl flows between nvim splits and tmux panes (no prefix)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# jump directly to pane by index, and keep pane numbers visible longer on prefix+q
set -g display-panes-time 4000

# dim inactive panes; active pane stays at full brightness
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=colour250,bg=black'

# inactive borders barely visible; active border glows green
set -g pane-border-style        'fg=colour238'
set -g pane-active-border-style 'fg=colour46,bold'

# always show pane index (and current command) on the pane border
set -g pane-border-status top
set -g pane-border-format " [#P] #{pane_title} "
# Jump straight to a pane by index with Ctrl+N, no prefix.
#
# A terminal cannot express Ctrl+digit on its own: Ctrl+1 sends a bare digit and
# Ctrl+3 collides with Escape (as Ctrl+8 does with Backspace). Alacritty is
# therefore configured (see config/alacritty/alacritty.toml) to send the CSI-u
# form for these — Ctrl+1 becomes "ESC [ 49 ; 5 u" — which tmux parses back into
# C-1. Without that terminal-side binding these lines are inert.
#
# resize-pane -Z toggles zoom, so re-zooming onto the target pane must be
# skipped when we're already on it — otherwise pressing Ctrl+N while on
# pane N un-zooms instead of staying put, exposing the split layout underneath.
bind -n C-1 if-shell -F '#{&&:#{window_zoomed_flag},#{!=:#{pane_index},1}}' 'select-pane -t 1 ; resize-pane -Z' 'select-pane -t 1'
bind -n C-2 if-shell -F '#{&&:#{window_zoomed_flag},#{!=:#{pane_index},2}}' 'select-pane -t 2 ; resize-pane -Z' 'select-pane -t 2'
bind -n C-3 if-shell -F '#{&&:#{window_zoomed_flag},#{!=:#{pane_index},3}}' 'select-pane -t 3 ; resize-pane -Z' 'select-pane -t 3'

# same jumps while in copy mode, matching the C-hjkl bindings above
bind -T copy-mode-vi C-1 select-pane -t 1
bind -T copy-mode-vi C-2 select-pane -t 2
bind -T copy-mode-vi C-3 select-pane -t 3

# Move in terminal using vim keybinding
set-window-option mode-keys vi

# mouse mode
# enable mouse mode
set -g mouse on

# Notify when a process completes in another window
set-window-option -g visual-bell on
set-window-option -g bell-action other

#some key binding
#open tmux split screens in the current directory
bind - split-window -c "#{pane_current_path}" 
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# sync working directory: cd every other pane in this window to the current
# pane's path. Only panes sitting at a shell prompt are touched, so a pane
# running nvim/less/etc. does not get "cd ..." typed into it.
bind S run-shell '
  path="#{pane_current_path}"
  cur="#{pane_id}"
  tmux list-panes -F "##{pane_id} ##{pane_current_command}" | while read -r p cmd; do
    [ "$p" = "$cur" ] && continue
    case "$cmd" in
      zsh|bash|sh|fish) tmux send-keys -t "$p" "cd \"$path\"" Enter ;;
    esac
  done
  true
'

# status line
# Set status bar
set -g status-left-length 50
set -g status-bg black
set -g status-fg gold
set -g status-left "#[bg=colour33,fg=white,bold]  #(echo '#S' | tr a-z A-Z)  #[bg=black,fg=colour33] "
set -g status-right '#[fg=green]Continuum status: #{continuum_status}'

# window name boxes: grey when inactive, green when active
set -g window-status-format         "#[bg=colour240,fg=white] #I:#W "
set -g window-status-current-format "#[bg=green,fg=black,bold] #I:#W "
set -g window-status-separator " "

# start window numbering from 1 instead of 0
set -g base-index 1

# panes start at 1 to match windows
setw -g pane-base-index 1

# renumber windows if a window is closed
set -g renumber-windows on

# kill the ~500ms Esc lag (matters in nvim)
set -s escape-time 0

# true color + 256 color so nvim themes render correctly inside tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Switch to last active window
bind-key a last-window
# Switch to last active pane
bind-key / last-pane

# cycle windows without prefix: j=left, k=right
bind -n M-j previous-window
bind -n M-k next-window

# jump directly to window by number without prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

#for easy reloading
bind R source-file ~/.tmux.conf

# fuzzy-find and switch to a window across all sessions
bind w display-popup -E "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --reverse | awk '{print \$1}' | xargs -r tmux switch-client -t"

# fuzzy-find and switch to a session
bind s display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs -r tmux switch-client -t"

# kill the current session (with confirmation)
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Track the two most-recently-used windows, then toggle between them with
# prefix+L. Every time a window gains focus the tracker records it as "current"
# and pushes the old current to "previous"; switching panes within the same
# window is ignored.
set -g focus-events on
set-hook -g pane-focus-in 'run-shell -b "~/Documents/badal/my-config/config/tmux/last-pane-track.sh #{window_id}"'
bind L run-shell '
  w=$(tmux show-environment -g TMUX_WIN_PREV 2>/dev/null | cut -d= -f2-)
  [ -n "$w" ] || exit 0
  tmux switch-client -t "$w"
  tmux select-window -t "$w"
'

# Layout switching
bind N run-shell ~/Documents/badal/my-config/config/tmux/layouts/laptop.sh
bind W run-shell ~/Documents/badal/my-config/config/tmux/layouts/widescreen.sh

# Popup terminal — handy in laptop/zoomed mode (prefix+t)
bind t display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "$SHELL"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

